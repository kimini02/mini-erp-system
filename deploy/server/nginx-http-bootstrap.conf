server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME;
    server_tokens off;
    access_log /var/log/nginx/workflow-access.json workflow_json;
    error_log /dev/null;
    include /etc/nginx/snippets/workflow/security-headers.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 301 https://CHANGE_ME$request_uri; }
}
