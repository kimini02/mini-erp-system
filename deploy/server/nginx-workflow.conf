server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME;
    server_tokens off;
    access_log /var/log/nginx/workflow-access.json workflow_json;
    error_log /dev/null;
    include /etc/nginx/snippets/workflow/security-headers.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 301 https://CHANGE_ME$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHANGE_ME;
    ssl_certificate /etc/letsencrypt/live/CHANGE_ME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    root /var/www/workflow/current;
    index index.html;
    access_log /var/log/nginx/workflow-access.json workflow_json;
    # Nginx error log cannot omit request queries; use sanitized access records for request diagnostics.
    # Config/startup errors remain available through nginx -t and the systemd journal.
    error_log /dev/null;
    include /etc/nginx/snippets/workflow/security-headers.conf;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    error_page 401 403 500 502 503 504 =503 /maintenance.html;
    location ^~ /api/v1/auth/ {
        limit_req zone=workflow_auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 =429 @rate_limited;
        include /etc/nginx/snippets/workflow/proxy-api.conf;
    }
    location /api/ { include /etc/nginx/snippets/workflow/proxy-api.conf; }
    location = /healthz {
        proxy_pass http://127.0.0.1:8081/actuator/health;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @health_down;
        include /etc/nginx/snippets/workflow/security-headers.conf;
    }
    location = /_workflow_ready {
        internal;
        proxy_pass http://127.0.0.1:8081/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 3s;
    }
    location ~ ^/(actuator(?:/|$)|swagger-ui(?:/|$)|swagger-ui.html$|v3/api-docs(?:/|$)) { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/workflow/security-headers.conf;
    }
    location = /index.html {
        auth_request /_workflow_ready;
        add_header Cache-Control no-cache always;
        include /etc/nginx/snippets/workflow/security-headers.conf;
    }
    location / {
        auth_request /_workflow_ready;
        try_files $uri /index.html;
        add_header Cache-Control no-cache always;
        include /etc/nginx/snippets/workflow/security-headers.conf;
    }
    location = /maintenance.html {
        root /var/www/workflow;
        add_header Cache-Control no-cache always;
        include /etc/nginx/snippets/workflow/security-headers.conf;
    }
    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/workflow/security-headers.conf;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"서버를 점검하고 있습니다. 잠시 후 다시 시도해 주세요."}}';
    }
    location @rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/workflow/security-headers.conf;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"요청이 많습니다. 잠시 후 다시 시도해 주세요."}}';
    }
    location @health_down {
        default_type application/json;
        include /etc/nginx/snippets/workflow/security-headers.conf;
        return 503 '{"status":"DOWN"}';
    }
}
