<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>점검 중 · WorkFlow</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #f9fafb; color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      }
      main {
        width: 100%; max-width: 420px; padding: 32px 28px; box-sizing: border-box;
        background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; text-align: center;
      }
      .brand { margin: 0 0 20px; font-size: 13px; font-weight: 600; color: #2563eb; letter-spacing: 0.02em; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #4b5563; }
      a {
        display: inline-block; margin-top: 24px; padding: 10px 18px; border-radius: 8px;
        background: #111827; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">WorkFlow</p>
      <h1>서버를 점검하고 있습니다</h1>
      <p>잠시 후 다시 접속해 주세요.<br />작성 중이던 내용이 있다면 다시 저장해 주세요.</p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
